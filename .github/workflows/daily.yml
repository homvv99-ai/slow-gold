name: daily
on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:
concurrency:
  group: daily-dawn
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests
      - name: publish + dawn voice
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python publish.py
      - name: push ledger (first publisher of the day owns it)
        run: |
          git config user.name "slow-gold-bot"
          git config user.email "bot@slowgold.local"
          git fetch origin main
          REMOTE_DATE=$(git show origin/main:site/data/signal.json | python -c "import sys,json;print(json.load(sys.stdin)['date'])" || echo none)
          LOCAL_DATE=$(python -c "import json;print(json.load(open('site/data/signal.json'))['date'])")
          echo "remote=$REMOTE_DATE local=$LOCAL_DATE"
          if [ "$REMOTE_DATE" != "$LOCAL_DATE" ]; then
            git add site/data
            git diff --cached --quiet || git commit -m "daily publish $(date -u +%F)"
            git push origin main
          else
            echo "Today's ledger already on remote — skip push"
          fi
