name: archive
on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
concurrency:
  group: archive
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build archive page
        run: python archive.py
      - name: commit archive
        run: |
          git config user.name "slow-gold-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/archive site/sitemap.xml
          git diff --cached --quiet || git commit -m "chore: daily archive page + sitemap update"
          git push
