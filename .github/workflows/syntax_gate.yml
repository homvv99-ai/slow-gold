name: بوابة الصياغة
on:
  push:
    paths:
      - binary_lab.py
      - cockpit.py
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile binary_lab.py cockpit.py
